name: validate-docs

# Runs on every pull request. No path filter on purpose: a required check that
# is skipped by a path filter never reports, and GitHub then blocks the merge.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check frontmatter, links and skills
        run: python .github/scripts/check_docs.py
      - name: Check CODEOWNERS owners exist
        # GitHub accepts an unknown owner silently and the path then loses its
        # code-owner review. This step fails the check instead.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          errs=$(gh api "repos/${{ github.repository }}/codeowners/errors?ref=${{ github.event.pull_request.head.sha }}" --jq '.errors')
          echo "$errs"
          [ "$(echo "$errs" | jq length)" = "0" ]
      - name: Scan for secrets
        # Unpinned image; pin a version once the approved-actions policy is known.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-banner --redact --verbose
